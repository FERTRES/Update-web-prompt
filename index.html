<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>ARA HOSTING – Image Host</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #000000;
      font-family: 'Inter', sans-serif;
      color: #eef2ff;
    }

    .app {
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem 1.5rem;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 2rem;
      border-bottom: 1px solid #3f4043;
      padding-bottom: 1rem;
    }

    .logo h1 {
      font-size: 1.8rem;
      font-weight: 700;
      background: linear-gradient(135deg, #283dde, #2554ea);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
    }

    .logo p {
      color: #a4a4a4;
      font-size: 0.85rem;
    }

    .badge {
      background: #052794;
      padding: 6px 14px;
      border-radius: 40px;
      font-size: 0.8rem;
      color: white;
    }

    .upload-card {
      background: #0c0f1c;
      border-radius: 28px;
      padding: 2rem;
      margin-bottom: 2rem;
      border: 1px solid #3f4043;
    }

    .drag-zone {
      border: 2px dashed #3f4043;
      border-radius: 20px;
      padding: 2.5rem;
      text-align: center;
      cursor: pointer;
      transition: 0.2s;
      background: #05070f;
    }

    .drag-zone.drag-over {
      border-color: #283dde;
      background: #0a0e1a;
    }

    .upload-icon {
      font-size: 2.8rem;
      margin-bottom: 0.5rem;
      color: #a4a4a4;
    }

    .file-input {
      display: none;
    }

    .preview-area {
      margin-top: 1.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .preview-img {
      max-width: 90px;
      max-height: 90px;
      border-radius: 12px;
      border: 1px solid #3f4043;
      object-fit: cover;
    }

    .btn-primary {
      background: #283dde;
      border: none;
      padding: 12px 28px;
      border-radius: 40px;
      font-weight: 600;
      color: white;
      cursor: pointer;
      transition: 0.2s;
    }

    .btn-primary:hover {
      background: #2554ea;
    }

    .btn-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .stats {
      display: flex;
      gap: 1.5rem;
      margin-bottom: 2rem;
      flex-wrap: wrap;
    }

    .stat-card {
      background: #0a0d18;
      border-radius: 20px;
      padding: 1rem 1.5rem;
      border: 1px solid #2a2c34;
      flex: 1;
    }

    .stat-number {
      font-size: 2rem;
      font-weight: 700;
      color: #2554ea;
    }

    .gallery-title {
      font-size: 1.3rem;
      font-weight: 600;
      margin-bottom: 1rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 1.5rem;
    }

    .image-card {
      background: #0c0f1c;
      border-radius: 20px;
      border: 1px solid #2a2c34;
      overflow: hidden;
      transition: 0.2s;
    }

    .image-card:hover {
      border-color: #283dde;
      transform: translateY(-2px);
    }

    .card-img {
      width: 100%;
      aspect-ratio: 16/12;
      object-fit: cover;
      background: #000;
      display: block;
    }

    .card-info {
      padding: 0.8rem 1rem;
    }

    .card-name {
      font-size: 0.75rem;
      color: #a4a4a4;
      margin-bottom: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .link-btn {
      background: #000000;
      border: 1px solid #283dde;
      border-radius: 40px;
      padding: 4px 12px;
      font-size: 0.7rem;
      cursor: pointer;
      display: inline-block;
    }

    .link-btn:hover {
      background: #052794;
      color: white;
    }

    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #283dde;
      color: white;
      padding: 10px 24px;
      border-radius: 60px;
      font-size: 0.8rem;
      opacity: 0;
      transition: opacity 0.2s;
      pointer-events: none;
      z-index: 1000;
    }

    footer {
      margin-top: 2.5rem;
      text-align: center;
      color: #5b5d6b;
      font-size: 0.75rem;
      border-top: 1px solid #20222b;
      padding-top: 1.5rem;
    }

    @media (max-width: 640px) {
      .app { padding: 1rem; }
      .grid { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>

<div class="app">
  <div class="header">
    <div class="logo">
      <h1>ARA HOSTING</h1>
      <p>unggah gambar · link instan</p>
    </div>
    <div class="badge">supabase storage</div>
  </div>

  <div class="upload-card">
    <div id="dragZone" class="drag-zone">
      <div class="upload-icon">📸</div>
      <p>Seret & lepas gambar di sini</p>
      <p style="color:#a4a4a4; font-size:0.8rem;">atau klik untuk pilih file</p>
      <input type="file" id="fileInput" class="file-input" accept="image/jpeg,image/png,image/gif,image/webp">
      <div id="previewArea" style="display: none;" class="preview-area">
        <img id="previewImg" class="preview-img">
        <button id="uploadBtn" class="btn-primary">Unggah sekarang</button>
      </div>
    </div>
  </div>

  <div class="stats">
    <div class="stat-card"><div class="stat-number" id="totalCount">0</div><div>gambar tersimpan</div></div>
    <div class="stat-card"><div class="stat-number" id="todayCount">0</div><div>upload hari ini</div></div>
    <div class="stat-card"><div class="stat-number">gratis</div><div>hosting permanen</div></div>
  </div>

  <div class="gallery-title">Galeri publik</div>
  <div id="galleryGrid" class="grid">
    <div style="grid-column:1/-1; text-align:center; padding:2rem;">memuat gambar...</div>
  </div>

  <footer>ARA HOSTING · gambar tersimpan di Supabase Storage</footer>
</div>

<div id="toastMsg" class="toast">link disalin</div>

<script>
  (function() {
    // ========== SUPABASE ==========
    const SUPABASE_URL = "https://qawcresnwfmwuuzevjgm.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFhd2NyZXNud2Ztd3V1emV2amdtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkxODk0OTYsImV4cCI6MjA5NDc2NTQ5Nn0.n7yx0_KY1JRiu3P1xEB2CM3UrPWwNP9ybf_8TazpJDo";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const BUCKET = "ara_images";
    const TABLE = "gallery";

    let currentFile = null;
    let objectUrl = null;

    // ========== helper ==========
    function showMessage(msg, isError = false) {
      const toast = document.getElementById("toastMsg");
      toast.style.backgroundColor = isError ? "#aa2e4e" : "#283dde";
      toast.textContent = msg;
      toast.style.opacity = "1";
      setTimeout(() => toast.style.opacity = "0", 2500);
    }

    // ========== setup bucket & table ==========
    async function setupStorage() {
      const { data: buckets } = await supabaseClient.storage.listBuckets();
      const exists = buckets?.some(b => b.name === BUCKET);
      if (!exists) {
        await supabaseClient.storage.createBucket(BUCKET, { public: true });
      }
    }

    // ========== ambil semua gambar ==========
    async function loadImages() {
      const { data, error } = await supabaseClient
        .from(TABLE)
        .select("*")
        .order("created_at", { ascending: false });
      if (error) {
        console.warn(error);
        return [];
      }
      for (let img of data) {
        const { data: { publicUrl } } = supabaseClient.storage.from(BUCKET).getPublicUrl(img.file_path);
        img.public_url = publicUrl;
      }
      return data;
    }

    async function renderGallery() {
      const images = await loadImages();
      const total = images.length;
      const today = new Date().toISOString().slice(0,10);
      const todayCount = images.filter(i => i.created_at?.startsWith(today)).length;
      document.getElementById("totalCount").innerText = total;
      document.getElementById("todayCount").innerText = todayCount;

      const grid = document.getElementById("galleryGrid");
      if (images.length === 0) {
        grid.innerHTML = '<div style="grid-column:1/-1; text-align:center; padding:2rem; color:#a4a4a4;">Belum ada gambar. Seret file ke area unggah.</div>';
        return;
      }

      grid.innerHTML = images.map(img => `
        <div class="image-card">
          <img class="card-img" src="${img.public_url}" alt="${img.original_name}" loading="lazy">
          <div class="card-info">
            <div class="card-name">${escapeHtml(img.original_name.substring(0, 28))}</div>
            <div class="link-btn" onclick="window.copyLink('${img.public_url}')">salin link</div>
          </div>
        </div>
      `).join('');
    }

    window.copyLink = (url) => {
      navigator.clipboard.writeText(url);
      showMessage(`Link disalin: ${url.substring(0, 50)}...`);
    };

    function escapeHtml(str) {
      if (!str) return "";
      return str.replace(/[&<>]/g, function(m) {
        if (m === "&") return "&amp;";
        if (m === "<") return "&lt;";
        if (m === ">") return "&gt;";
        return m;
      });
    }

    // ========== upload ==========
    async function uploadImage(file) {
      const ext = file.name.split('.').pop();
      const fileName = `${Date.now()}_${Math.random().toString(36).substring(2)}.${ext}`;
      const filePath = `uploads/${fileName}`;

      const { error: uploadErr } = await supabaseClient.storage
        .from(BUCKET)
        .upload(filePath, file, { cacheControl: "3600" });

      if (uploadErr) {
        showMessage("Gagal upload: " + uploadErr.message, true);
        return false;
      }

      const { data: { publicUrl } } = supabaseClient.storage.from(BUCKET).getPublicUrl(filePath);

      const { error: dbErr } = await supabaseClient.from(TABLE).insert([{
        original_name: file.name,
        file_path: filePath,
        size_bytes: file.size,
        mime_type: file.type,
        public_url: publicUrl
      }]);

      if (dbErr) {
        console.error(dbErr);
        showMessage("Gambar tersimpan, tapi metadata gagal", true);
      }
      return true;
    }

    // ========== UI DRAG & DROP (paling stabil) ==========
    const dragZone = document.getElementById("dragZone");
    const fileInput = document.getElementById("fileInput");
    const previewArea = document.getElementById("previewArea");
    const previewImg = document.getElementById("previewImg");
    const uploadBtn = document.getElementById("uploadBtn");

    if (!dragZone) {
      console.error("dragZone element not found");
      return;
    }

    // klik untuk pilih file
    dragZone.addEventListener("click", (e) => {
      if (e.target === uploadBtn || (uploadBtn && uploadBtn.contains(e.target))) return;
      fileInput.click();
    });

    // drag over
    dragZone.addEventListener("dragover", (e) => {
      e.preventDefault();
      e.stopPropagation();
      dragZone.classList.add("drag-over");
    });

    dragZone.addEventListener("dragleave", (e) => {
      e.preventDefault();
      e.stopPropagation();
      dragZone.classList.remove("drag-over");
    });

    // drag drop
    dragZone.addEventListener("drop", (e) => {
      e.preventDefault();
      e.stopPropagation();
      dragZone.classList.remove("drag-over");
      
      const files = e.dataTransfer.files;
      if (files.length > 0 && files[0].type.startsWith("image/")) {
        handleFile(files[0]);
      } else {
        showMessage("Hanya file gambar yang didukung", true);
      }
    });

    fileInput.addEventListener("change", (e) => {
      if (e.target.files.length > 0) {
        handleFile(e.target.files[0]);
      }
    });

    function handleFile(file) {
      currentFile = file;
      if (objectUrl) URL.revokeObjectURL(objectUrl);
      objectUrl = URL.createObjectURL(file);
      previewImg.src = objectUrl;
      previewArea.style.display = "flex";
    }

    uploadBtn.addEventListener("click", async () => {
      if (!currentFile) return;
      uploadBtn.disabled = true;
      uploadBtn.innerText = "Mengunggah...";
      const ok = await uploadImage(currentFile);
      uploadBtn.disabled = false;
      uploadBtn.innerText = "Unggah sekarang";
      if (ok) {
        showMessage("Gambar berhasil dihosting");
        currentFile = null;
        previewArea.style.display = "none";
        if (objectUrl) URL.revokeObjectURL(objectUrl);
        fileInput.value = "";
        await renderGallery();
      } else {
        showMessage("Upload gagal, coba lagi", true);
      }
    });

    // ========== INIT ==========
    (async () => {
      try {
        await setupStorage();
        await renderGallery();
      } catch (err) {
        console.error(err);
        showMessage("Gagal konek ke Supabase, cek console", true);
      }
    })();
  })();
</script>
</body>
</html>
